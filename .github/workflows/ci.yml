name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal (smoke + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # postinstall fetches the browser binary; this adds the system libraries
      # it needs, which a bare runner does not have.
      - run: npm ci
      - run: npx playwright install-deps chromium

      # Cheap, and catches the page-size, escaping and CSRF-header rules
      # without starting a browser.
      - name: Static portal checks
        run: python3 tools/web_pages_smoke.py

      - name: Playwright
        run: npx playwright test --project=iphone-13-pro-max-chromium

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: Portal (visual regression)
    runs-on: ubuntu-latest
    # Screenshot baselines are pixel comparisons, so they only mean anything
    # against the renderer that produced them. This image is what makes them
    # reproducible; keep the tag and the @playwright/test version in
    # package.json in step.
    #
    # ONE-TIME BOOTSTRAP: no baselines are committed yet, so the first run of
    # this job fails with "A snapshot doesn't exist". Download the
    # `visual-baselines` artifact it uploads, commit its contents to
    # tests/ap-portal-visual/ap-portal.visual.spec.ts-snapshots/, and this
    # becomes a real gate. Regenerate the same way after an intended UI change.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Ensure python3 (needed by the preview extractor)
        run: |
          if ! command -v python3 >/dev/null; then
            apt-get update -qq && apt-get install -y -qq python3
          fi

      - run: npm ci

      - name: Visual comparison
        env:
          AP_PORTAL_VISUAL: '1'
        run: npx playwright test tests/ap-portal-visual/ --project=iphone-13-pro-max-chromium

      - name: Upload baselines and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: |
            tests/ap-portal-visual/ap-portal.visual.spec.ts-snapshots/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('Platformio/Dog-RGB/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - run: pip install --upgrade platformio

      - name: Build seeed_xiao_esp32s3
        working-directory: Platformio/Dog-RGB
        run: pio run -e seeed_xiao_esp32s3
