name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-foundation:
    name: Cloud foundation (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - run: npm ci

      - name: Run clean local foundation gate
        run: npm run phase1:local -- --clean

      - name: Run migrated-schema capacity gate
        run: npm run phase1:capacity -- --clean

      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-capacity-${{ github.sha }}
          path: test-results/capacity/phase1-local.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

  host-tests:
    name: Firmware (host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19

      # The native scene JSON characterization test compiles against the same
      # pinned ArduinoJson headers as the target build. A clean runner has no
      # .pio/libdeps tree until PlatformIO resolves the project dependencies.
      - name: Resolve native test dependencies
        working-directory: Platformio/Dog-RGB
        run: pio pkg install -e seeed_xiao_esp32s3

      - name: Run firmware host suite
        working-directory: Platformio/Dog-RGB
        run: python -m unittest discover -s test -p "test_*.py" -v

  portal:
    name: Portal (smoke + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # postinstall fetches the browser binary; this adds the system libraries
      # it needs, which a bare runner does not have.
      - run: npm ci
      - run: npx playwright install-deps chromium

      # Cheap, and catches the page-size, escaping and CSRF-header rules
      # without starting a browser.
      - name: Verify generated portal assets
        run: npm run webui:check

      - name: Test deterministic portal generator
        run: npm run webui:unit

      - name: Static portal checks
        run: python3 tools/web_pages_smoke.py

      - name: Playwright
        run: npx playwright test --project=iphone-13-pro-max-chromium

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: Portal (visual regression)
    runs-on: ubuntu-latest
    # Screenshot baselines are pixel comparisons, so they only mean anything
    # against the renderer that produced them. The committed baselines carry a
    # -linux suffix and were generated in this exact image; keep the tag and
    # the @playwright/test version in package.json in step, or every comparison
    # starts failing for reasons that have nothing to do with the UI.
    #
    # After an intended UI change, regenerate with:
    #   npm run ap-portal:visual:baseline
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Verify generated portal assets
        run: npm run webui:check

      - name: Visual comparison
        env:
          AP_PORTAL_VISUAL: '1'
        run: npx playwright test tests/ap-portal-visual/ --project=iphone-13-pro-max-chromium

      # On failure these hold the actual/expected/diff triplets, which is the
      # only practical way to judge whether a pixel change was intended.
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-6.1.19-${{ runner.os }}-${{ hashFiles('Platformio/Dog-RGB/platformio.ini') }}
          restore-keys: pio-6.1.19-${{ runner.os }}-

      # Keep the CLI reproducible too; the platform, framework and libraries
      # are already pinned in platformio.ini.
      - run: python -m pip install platformio==6.1.19

      - name: Record build environment
        working-directory: Platformio/Dog-RGB
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-firmware-baseline
          {
            echo "git_commit=$(git rev-parse HEAD)"
            python --version
            pio --version
          } | tee artifacts/ci-firmware-baseline/environment.txt

      - name: Build seeed_xiao_esp32s3
        working-directory: Platformio/Dog-RGB
        run: |
          set -o pipefail
          pio run -e seeed_xiao_esp32s3 2>&1 | tee artifacts/ci-firmware-baseline/build.txt

      - name: Record resolved packages
        working-directory: Platformio/Dog-RGB
        run: |
          set -o pipefail
          {
            echo
            pio pkg list -e seeed_xiao_esp32s3
          } | tee -a artifacts/ci-firmware-baseline/environment.txt

      - name: Capture RAM and flash usage
        working-directory: Platformio/Dog-RGB
        run: |
          set -o pipefail
          pio run -e seeed_xiao_esp32s3 -t size 2>&1 | tee artifacts/ci-firmware-baseline/size.txt
          {
            echo "## Firmware size baseline"
            echo
            echo '```text'
            cat artifacts/ci-firmware-baseline/size.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inventory firmware artifacts
        working-directory: Platformio/Dog-RGB
        run: |
          set -o pipefail
          find .pio/build/seeed_xiao_esp32s3 -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) \
            -printf '%f %s bytes\n' | sort | tee artifacts/ci-firmware-baseline/files.txt
          find .pio/build/seeed_xiao_esp32s3 -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) \
            -print0 | sort -z | xargs -0 -r sha256sum \
            > artifacts/ci-firmware-baseline/sha256sums.txt

      - name: Upload firmware baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-baseline-seeed-xiao-esp32s3-${{ github.sha }}
          path: |
            Platformio/Dog-RGB/artifacts/ci-firmware-baseline/
            Platformio/Dog-RGB/.pio/build/seeed_xiao_esp32s3/*.bin
            Platformio/Dog-RGB/.pio/build/seeed_xiao_esp32s3/firmware.elf
            Platformio/Dog-RGB/.pio/build/seeed_xiao_esp32s3/firmware.map
          if-no-files-found: warn
          retention-days: 14
