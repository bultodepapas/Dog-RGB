; Minimal ESP32-S3 SoftAP diagnostic firmware.
; This project is intentionally separate from Platformio/Dog-RGB so AP testing
; cannot affect the production firmware source tree.

[env:seeed_xiao_esp32s3]
platform = espressif32@6.7.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
