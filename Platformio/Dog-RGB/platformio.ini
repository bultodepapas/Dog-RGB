
; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32s3

[dog_rgb]
; Exact pioarduino release: Arduino-ESP32 3.3.11 on ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board_build.partitions = partitions_dog_rgb.csv
monitor_speed = 115200
extra_scripts = pre:tools/check_web_assets.py
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  adafruit/Adafruit NeoPixel@1.15.5

[env:seeed_xiao_esp32s3]
platform = ${dog_rgb.platform}
board = seeed_xiao_esp32s3
framework = ${dog_rgb.framework}
board_build.partitions = ${dog_rgb.board_build.partitions}
monitor_speed = ${dog_rgb.monitor_speed}
extra_scripts = ${dog_rgb.extra_scripts}
lib_deps = ${dog_rgb.lib_deps}
build_src_filter = +<*> -<bringup/> -<display/>
build_flags =
  ${dog_rgb.build_flags}
  -DDOG_RGB_BOARD_XIAO_S3=1

; Keep a separate output directory for Wokwi while inheriting the exact
; production board, partition table and libraries. This target routes Serial
; to UART0 because Wokwi captures UART0 internally; no D6/D7 monitor wires are
; required. Keep this isolated from the USB CDC production build.
[env:wokwi]
extends = env:seeed_xiao_esp32s3
monitor_speed = 460800
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  ${env:seeed_xiao_esp32s3.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DDOG_RGB_WOKWI_SIM=1
  ; Keep effect/state calculations at the production 50 ms cadence, but cap
  ; the expensive virtual WS2812 transport at 5 FPS for usable simulation.
  -DDOG_RGB_WOKWI_LED_SHOW_MS=200

; Candidate V2 No Touch hardware: confirm PCB revision before flashing.
; Shared flags/filters keep earlier diagnostics free of graphics dependencies.
[dog_rgb_waveshare]
build_flags =
  ${dog_rgb.build_flags}
  -DDOG_RGB_BOARD_WAVESHARE_LCD169_V2=1
build_src_filter = +<*> -<bringup/> -<display/>

; Same application core and storage, with the I3 text display.
[env:waveshare_lcd169]
platform = ${dog_rgb.platform}
board = waveshare_lcd169_v2
framework = ${dog_rgb.framework}
board_build.partitions = ${dog_rgb.board_build.partitions}
monitor_speed = ${dog_rgb.monitor_speed}
extra_scripts = ${dog_rgb.extra_scripts}
lib_deps =
  ${dog_rgb.lib_deps}
  moononournation/GFX Library for Arduino@1.6.7
build_src_filter = +<*> -<bringup/>
build_flags =
  ${dog_rgb_waveshare.build_flags}
  -DDOG_RGB_DISPLAY_ENABLED=1

; I0 only: serial/power diagnostics; keep this target free of LED transport.
[env:waveshare_lcd169_bringup]
extends = env:waveshare_lcd169
lib_deps = ${dog_rgb.lib_deps}
build_src_filter = +<main.cpp> +<board/> +<bringup/bringup.cpp>
build_flags =
  ${dog_rgb_waveshare.build_flags}
  -DDOG_RGB_BRINGUP_STAGE=0

; I1: same board/entry point, explicitly selected LED bench diagnostic.
; Starts black and waits for console commands; no welcome/GPS/radio/NVS.
[env:waveshare_lcd169_ledcheck]
extends = env:waveshare_lcd169_bringup
build_src_filter =
  ${env:waveshare_lcd169_bringup.build_src_filter}
  +<bringup/led_check.cpp>
  +<led/led_bus.cpp> +<led/led_color.cpp> +<led/power_limiter.cpp>
build_flags =
  ${dog_rgb_waveshare.build_flags}
  -DDOG_RGB_BRINGUP_STAGE=1

; I2 uses the normal application, GPS/parser/persistence and LED policy.
; Only the diagnostic is added: no I1 patterns or second LED driver.
[env:waveshare_lcd169_gpscheck]
extends = env:waveshare_lcd169
lib_deps = ${dog_rgb.lib_deps}
build_src_filter =
  ${dog_rgb_waveshare.build_src_filter}
  +<bringup/gps_check.cpp>
build_flags =
  ${dog_rgb_waveshare.build_flags}
  -DDOG_RGB_BRINGUP_STAGE=2

; I3: normal core and text LCD, I2 bench limits and bounded USB LCD controls.
[env:waveshare_lcd169_displaycheck]
extends = env:waveshare_lcd169
build_src_filter =
  ${env:waveshare_lcd169.build_src_filter}
  +<bringup/gps_check.cpp>
build_flags =
  ${env:waveshare_lcd169.build_flags}
  -DDOG_RGB_BRINGUP_STAGE=3
