
; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32@6.7.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = partitions_dog_rgb.csv
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  adafruit/Adafruit NeoPixel@1.12.3

; Keep a separate output directory for Wokwi while inheriting the exact
; production board, partition table and libraries. The XIAO board definition
; already enables the ESP32-S3 USB Serial/JTAG CDC interface used by Wokwi.
[env:wokwi]
extends = env:seeed_xiao_esp32s3
