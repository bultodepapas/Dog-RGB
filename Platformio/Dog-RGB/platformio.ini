
; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32@6.7.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = partitions_dog_rgb.csv
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  adafruit/Adafruit NeoPixel@1.12.3

; Keep a separate output directory for Wokwi while inheriting the exact
; production board, partition table and libraries. Arduino-ESP32 2.0.16 HWCDC
; currently watchdogs in the simulator, so only this target routes Serial to
; UART0. Wokwi captures UART0 internally; no D6/D7 monitor wires are required.
[env:wokwi]
extends = env:seeed_xiao_esp32s3
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  ${env:seeed_xiao_esp32s3.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DDOG_RGB_WOKWI_SIM=1
