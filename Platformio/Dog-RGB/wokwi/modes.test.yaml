name: "Dog-RGB runtime modes, day mode, geofence and persistence"
version: 1
author: "Dog-RGB"
steps:
  - wait-serial: "Dog-RGB ESP32-S3 GPS-first base firmware"
  - wait-serial: "[SIM_CTRL] ready"
  - write-serial: "sim leds off\n"
  - wait-serial: "[SIM_CTRL] ok command=leds transport=off"
  - delay: 3000ms
  - wait-serial: "[GPS_FIX] raw=1 trusted=1 current=1 reason=ok"

  - write-serial: "sim mode simple\n"
  - wait-serial: "[SIM_CTRL] ok command=mode value=simple"
  - delay: 2200ms
  - wait-serial: "[LED] mode=simple body_on=1 render=simple"

  - write-serial: "sim reboot\n"
  - wait-serial: "[SIM_CTRL] ok command=reboot"
  - wait-serial: "Dog-RGB ESP32-S3 GPS-first base firmware"
  - wait-serial: "[SIM_CTRL] ready"
  - write-serial: "sim leds off\n"
  - wait-serial: "[SIM_CTRL] ok command=leds transport=off"
  - delay: 2200ms
  - wait-serial: "[MOTION] mode=simple"

  - write-serial: "sim mode show\n"
  - wait-serial: "[SIM_CTRL] ok command=mode value=show"
  - delay: 2200ms
  - wait-serial: "[LED] mode=show body_on=1 render=show"

  - write-serial: "sim home here\n"
  - wait-serial: "[SIM_CTRL] ok command=home value=here"
  - write-serial: "sim mode geofence\n"
  - wait-serial: "[SIM_CTRL] ok command=mode value=geofence"
  - set-control:
      part-id: gnss
      control: positionM
      value: 450
  - delay: 2500ms
  - wait-serial: "[LED] mode=geofence body_on=1 render=range home_missing=0"
  - wait-serial: " range=10 dist_m="

  - write-serial: "sim day on\n"
  - wait-serial: "[SIM_CTRL] ok command=day value=on"
  - delay: 2200ms
  - wait-serial: "[LED] mode=geofence body_on=0 render=day_status"
  - wait-serial: "day_mode=active local_min=900"

  - set-control:
      part-id: gnss
      control: utcHour
      value: 22
  - delay: 2200ms
  - wait-serial: "day_mode=outside_window local_min=1020"

  - write-serial: "sim day off\n"
  - wait-serial: "[SIM_CTRL] ok command=day value=off"
  - write-serial: "sim mode speed\n"
  - wait-serial: "[SIM_CTRL] ok command=mode value=speed"
  - delay: 2200ms
  - wait-serial: "[LED] mode=speed body_on=1 render=range"
