name: "Dog-RGB boot, Wi-Fi, GNSS and LED smoke test"
version: 1
author: "Dog-RGB"
steps:
  - wait-serial: "Dog-RGB ESP32-S3 GPS-first base firmware"
  - delay: 4000ms
  - wait-serial: "[GPS_FIX] raw=1 trusted=1 current=1 reason=ok"
  - wait-serial: "[WIFI] mode=AP sta=0 sta_try=0 ap=1"
  - wait-serial: "[MOTION] mode=speed"
