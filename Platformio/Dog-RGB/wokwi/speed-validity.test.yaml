name: "Dog-RGB rejected speed spike and diagnostic recovery"
version: 1
author: "Dog-RGB"
steps:
  - wait-serial: "Dog-RGB ESP32-S3 GPS-first base firmware"
  - write-serial: "sim leds off\n"
  - wait-serial: "[SIM_CTRL] ok command=leds transport=off"
  - write-serial: "sim mode speed\n"
  - wait-serial: "[SIM_CTRL] ok command=mode value=speed"
  - delay: 3000ms
  - wait-serial: "[GPS_FIX] raw=1 trusted=1 current=1 reason=ok"

  - set-control:
      part-id: gnss
      control: profile
      value: 10
  - delay: 2200ms
  - wait-serial: "speed_spike_seen=1"
  - wait-serial: "[MOTION] mode=speed speed_kph=0.00 usable=0 active=0 range=1"
  - wait-serial: "seg_reason=speed_spike"

  - set-control:
      part-id: gnss
      control: profile
      value: 0
  - delay: 2200ms
  - wait-serial: "[MOTION] mode=speed speed_kph=12.00 usable=1 active=1 range=7"
  - wait-serial: "overflow=0"
