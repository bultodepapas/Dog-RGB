[wokwi]
version = 1
firmware = ".pio/build/wokwi/firmware.bin"
elf = ".pio/build/wokwi/firmware.elf"
rfc2217ServerPort = 4000

# Expose the Dog-RGB HTTP portal as http://localhost:8180 when the
# Wokwi private gateway is enabled.
[[net.forward]]
from = "localhost:8180"
to = "target:80"

[[chip]]
name = "nmea-gps"
binary = "chips/nmea-gps.chip.wasm"
